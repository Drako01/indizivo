# INACTIVE: move only with explicit owner approval.
# Defense-in-depth: publication ALSO requires GitHub variable INDIZIVO_RELEASE_ENABLED == 'true'.
name: Indizivo / Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Explicitly approve publishing the current Indizivo version
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: indizivo-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main' && vars.INDIZIVO_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        name: Publish only changed versions or explicitly approved manual runs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm_publication }}
        run: |
          version=$(node -p "require('./package.json').version")
          previous=$(git show HEAD^:package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('none')}})" || echo none)
          publish=false
          if [ "$EVENT" = push ] && [ "$version" != "$previous" ]; then publish=true; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$CONFIRM" = true ]; then publish=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Indizivo $version: publish=$publish" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev
  vscode-e2e:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:e2e
  package:
    needs: [plan, verify, vscode-e2e]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Test installed VSIX in isolated VS Code profile
        run: xvfb-run -a npm run smoke:vsix
      - name: Inventory check
        run: npm run inspect:vsix
      - name: Record original VSIX checksum
        shell: bash
        run: sha256sum indizivo-*.vsix > indizivo.vsix.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indizivo-vsix
          path: |
            indizivo-*.vsix
            indizivo.vsix.sha256
          if-no-files-found: error
  marketplace:
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indizivo-vsix
      - name: Publish exact artifact with short-lived OIDC credentials
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sha256sum --check indizivo.vsix.sha256
          test -f "indizivo-$VERSION.vsix"
          npm exec --yes --package=@vscode/vsce@4.0.2 -- vsce publish --oidc --packagePath "indizivo-$VERSION.vsix" --skip-duplicate
  open-vsx:
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indizivo-vsix
      - name: Publish same VSIX using Open VSX Trusted Publishing
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sha256sum --check indizivo.vsix.sha256
          test -f "indizivo-$VERSION.vsix"
          unset OVSX_PAT OVSX_TOKEN
          npm exec --yes --package=ovsx@1.3.0 -- ovsx publish "indizivo-$VERSION.vsix" --trusted-publishing --skip-duplicate
  release:
    needs: [plan, marketplace]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indizivo-vsix
      - name: Create release after Marketplace succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" "indizivo-$VERSION.vsix" indizivo.vsix.sha256 --target "$GITHUB_SHA" --title "Indizivo $VERSION" --generate-notes
