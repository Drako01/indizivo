# Verify each proposed change; never publish from this workflow.
name: Indizivo / Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indizivo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure Marketplace publishing CLI exists in the registry
        if: runner.os == 'Linux'
        run: npm exec --yes --package=@vscode/vsce@4.1.0 -- vsce --version
      - run: npm run verify
      - name: Coverage floors for critical modules
        if: runner.os == 'Linux'
        run: npm run test:coverage-gate
      - run: npm audit --omit=dev

  vscode-e2e:
    name: Official VS Code Extension Host / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:e2e
      # The PR gate also checks the exact installable artifact, not only source-mode E2E.
      # Package directly after test:e2e (which already compiled TS); do not repeat verify.
      - name: Package the candidate VSIX and inspect its inventory
        run: npm run package:vsix
      - name: Smoke test the installed package in an isolated VS Code profile
        run: xvfb-run -a npm run smoke:vsix
      - name: Fingerprint the verified candidate
        run: sha256sum indizivo-0.3.0.vsix | tee indizivo.candidate.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indizivo-0.3.0-pr-candidate
          path: |
            indizivo-0.3.0.vsix
            indizivo.candidate.sha256
          if-no-files-found: error
          retention-days: 14
